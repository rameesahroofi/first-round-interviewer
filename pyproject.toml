[project]
name = "first-round-interviewer"
version = "0.1.0"
description = "AI-powered first-round interview agent"
requires-python = ">=3.12"

dependencies = [
    "livekit-agents>=1.6,<2",
    "livekit-api",
    "livekit-plugins-google",
    "python-dotenv",
    "langgraph",
    "langchain",
    "langchain-google-genai",
    "fastapi[standard]",
    "python-multipart",
    "pypdf",
    "google-genai",
    "streamlit",
    "uvicorn[standard]",
    "reportlab",
]

[tool.livekit]
agent = "src/realtime/agent.py"